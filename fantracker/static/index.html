<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ウマ娘 ファン数トラッカー</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header>
  <h1>ウマ娘 ファン数トラッカー</h1>
  <nav>
    <button data-tab="import" class="active">取り込み</button>
    <button data-tab="dashboard">ダッシュボード</button>
    <button data-tab="records">記録一覧</button>
  </nav>
</header>
<main>
  <section id="tab-import">
    <div id="dropzone" tabindex="0">
      <p>進行状況のスクリーンショットをここにドロップ、またはクリックして選択(複数可)</p>
      <input id="file-input" type="file" accept="image/png,image/jpeg" multiple hidden>
    </div>
    <div id="scan-actions" hidden>
      <button id="confirm-all" class="primary">警告のない項目をすべて確定</button>
      <span id="scan-status"></span>
    </div>
    <div id="scan-results"></div>
  </section>

  <section id="tab-dashboard" hidden>
    <div class="controls">
      <label>期間
        <select id="period">
          <option value="7">直近7日</option>
          <option value="30">直近30日</option>
          <option value="all" selected>全期間</option>
        </select>
      </label>
      <label><input type="checkbox" id="interpolate"> 欠損日を日割り補間する</label>
    </div>
    <p id="dash-empty" hidden>記録がまだありません。「取り込み」から追加してください。</p>
    <div id="dash-body">
      <div class="chart-card">
        <h2>総獲得ファン数の推移</h2>
        <canvas id="chart-total" height="110"></canvas>
        <button class="dl" data-chart="chart-total" data-name="fan_total">PNG でダウンロード</button>
      </div>
      <div class="chart-card">
        <h2>日次増加量</h2>
        <canvas id="chart-inc" height="110"></canvas>
        <button class="dl" data-chart="chart-inc" data-name="daily_increase">PNG でダウンロード</button>
      </div>
      <p class="note">記録のない日があると、増加量は経過日数分の合計になります(表の「備考」に表示)。</p>
      <h2>日次</h2>
      <table id="tbl-daily"></table>
      <h2>週次(月曜始まり)</h2>
      <table id="tbl-weekly"></table>
      <h2>月次</h2>
      <table id="tbl-monthly"></table>
    </div>
  </section>

  <section id="tab-records" hidden>
    <div class="controls">
      <label><input type="checkbox" id="show-history"> 履歴(非採用)も表示</label>
      <a id="export-link" class="btn" href="/api/export.csv">CSV エクスポート</a>
      <button id="csv-pick">CSV インポート…</button>
      <input id="csv-input" type="file" accept=".csv,text/csv" hidden>
    </div>
    <div id="csv-panel" hidden></div>
    <form id="manual-form" class="controls">
      <strong>手動追加</strong>
      <label>撮影日時 <input type="datetime-local" name="captured_at" required></label>
      <label>総獲得ファン数 <input type="text" name="fan_total" inputmode="numeric" required></label>
      <button class="primary">追加</button>
      <span id="manual-msg"></span>
    </form>
    <table id="tbl-records"></table>
  </section>
</main>
<script src="chart.umd.min.js"></script>
<script src="app.js"></script>
</body>
</html>
